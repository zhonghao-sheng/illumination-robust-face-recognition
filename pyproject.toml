[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "illumination-robust-face-recognition"
version = "0.2.0"
description = "Grouped nested evaluation of face recognition under lighting shifts"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2,<4",
  "scikit-learn>=1.3,<2",
  "opencv-python>=4.8,<5",
  "torch>=2.1,<3",
  "torchvision>=0.16,<1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
